[project]
name = "refora-server"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "deepagents==0.6.12",
  "langchain==1.3.14",
  "langchain-core==1.5.1",
  "langgraph==1.2.9",
  "langchain-openai==1.4.1",
  "langgraph-checkpoint-sqlite==3.1.0",
  "aiosqlite==0.22.1",
  "fastapi>=0.115,<0.116",
  "uvicorn[standard]>=0.34,<0.35",
  "websockets>=15,<16",
  "python-multipart>=0.0.18,<0.1",
  "httpx[socks]>=0.27,<1.0",
  "beautifulsoup4>=4.12,<5.0",
  "lxml>=5.0,<6.0",
  "pypdf>=4.3,<6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0,<9.0",
  "pytest-asyncio>=0.23,<1.0",
]
sidecar = [
  "pyinstaller==6.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["refora_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
