appId: com.refora.app
productName: Refora
directories:
  output: dist
  buildResources: build
files:
  - out/**/*
extraResources:
  - from: backend/workers/mineru_worker.py
    to: mineru/mineru_worker.py
  - from: build/python-server
    to: python-server
    filter:
      - '**/*'
asar: true
asarUnpack:
  - '**/*.node'
mac:
  binaries:
    - Contents/Resources/python-server/refora-server
  artifactName: ${productName}-${version}-${arch}.${ext}
  target:
    - dmg
  category: public.app-category.productivity
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  notarize: true
