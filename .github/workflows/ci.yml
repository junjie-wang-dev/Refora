name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      e2e-artifact-name: Refora-e2e-${{ github.sha }}
      verify-timeout-minutes: 40

  package:
    name: Package ${{ matrix.arch }}
    needs: quality
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: '0.11.32'
          enable-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Package macOS application
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          REFORA_TARGET_ARCH: ${{ matrix.arch }}
        run: npm run package -- --publish never

      - name: Upload macOS package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Refora-macOS-${{ matrix.arch }}-${{ github.sha }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14
