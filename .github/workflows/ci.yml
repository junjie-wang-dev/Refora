name: CI

on:
  push:
    branches:
      - '**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.32'
          enable-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit & Component Tests
        run: npm run test

      - name: Python Server Tests
        run: uv run --project python/server --locked pytest

      - name: Workspace Card Interaction E2E
        run: npm run test:e2e:workspace-card

      - name: Upload Workspace Card E2E diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Refora-workspace-card-e2e-${{ github.sha }}
          path: test-results
          if-no-files-found: warn
          retention-days: 7

  package:
    name: Package ${{ matrix.arch }}
    needs: verify
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15
          - arch: x64
            runner: macos-15-intel

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          version: '0.11.32'
          enable-cache: true

      - name: Install dependencies
        run: npm ci

      - name: Package macOS application
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          REFORA_TARGET_ARCH: ${{ matrix.arch }}
        run: npm run package -- --publish never

      - name: Upload macOS package
        uses: actions/upload-artifact@v4
        with:
          name: Refora-macOS-${{ matrix.arch }}-${{ github.sha }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14
