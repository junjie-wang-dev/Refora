name: CI

on:
  push:
    branches:
      - main
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    uses: ./.github/workflows/quality.yml
    with:
      e2e-artifact-name: Refora-e2e-${{ github.sha }}
      verify-timeout-minutes: 40

  package:
    name: Package ${{ matrix.arch }}
    needs: quality
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            runner: macos-15

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up pinned toolchain
        uses: ./.github/actions/setup

      - name: Install locked dependencies
        run: npm run ci:stage -- prepare

      - name: Package macOS application
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          REFORA_TARGET_ARCH: ${{ matrix.arch }}
        run: npm run ci:stage -- package

      - name: Preserve packaging evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Package-evidence-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: warn
          retention-days: 14

      - name: Upload macOS package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Refora-macOS-${{ matrix.arch }}-${{ github.sha }}
          path: dist/*.dmg
          if-no-files-found: error
          retention-days: 14

  ready:
    name: CI Ready
    if: always()
    needs: [quality, package]
    runs-on: ubuntu-24.04
    steps:
      - name: Require every gate to succeed
        env:
          QUALITY_RESULT: ${{ needs.quality.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
        run: |
          test "$QUALITY_RESULT" = success
          test "$PACKAGE_RESULT" = success
