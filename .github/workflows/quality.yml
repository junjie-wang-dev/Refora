name: Quality gates

on:
  workflow_call:
    inputs:
      e2e-artifact-name:
        required: true
        type: string
      verify-timeout-minutes:
        required: true
        type: number

permissions:
  contents: read

jobs:
  verify:
    name: Verify
    runs-on: macos-15
    timeout-minutes: ${{ inputs.verify-timeout-minutes }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup
      - name: Shared verification, audits, and stability checks
        run: npm run ci:stage -- prepare verify audit stability
      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: Verify-${{ inputs.e2e-artifact-name }}-${{ github.run_attempt }}
          path: |
            test-results
            coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

  e2e:
    name: E2E
    needs: verify
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup
      - name: Shared Electron end-to-end gate
        run: npm run ci:stage -- prepare e2e
      - name: Preserve E2E evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ inputs.e2e-artifact-name }}-${{ github.run_attempt }}
          path: |
            test-results
            playwright-report
          if-no-files-found: warn
          retention-days: 14

  supabase:
    name: Supabase PostgreSQL RPC and RLS
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17.6-bookworm
        env:
          POSTGRES_DB: refora_sync_test
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d refora_sync_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: ./.github/actions/setup
      - name: Shared PostgreSQL gate
        env:
          REFORA_SUPABASE_TEST_DB_URL: postgresql://postgres@127.0.0.1:5432/refora_sync_test
          REFORA_SUPABASE_TEST_DB_PASSWORD: postgres
          REFORA_SUPABASE_TEST_SSL: 'false'
        run: npm run ci:stage -- database
      - name: Preserve PostgreSQL evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: PostgreSQL-${{ inputs.e2e-artifact-name }}-${{ github.run_attempt }}
          path: test-results
          if-no-files-found: warn
          retention-days: 14
