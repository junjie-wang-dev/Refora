[project]
name = "refora-server"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
  "deepagents==0.6.12",
  "langchain==1.3.14",
  "langchain-core==1.5.1",
  "langgraph==1.2.9",
  "langchain-openai==1.4.1",
  "langgraph-checkpoint-sqlite>=3.1.1,<4.0",
  "aiosqlite==0.22.1",
  "fastapi>=0.141,<0.142",
  "starlette>=1.3.1,<2.0",
  "uvicorn[standard]>=0.34,<0.35",
  "websockets>=15,<16",
  "httpx[socks]>=0.27,<1.0",
  "beautifulsoup4>=4.12,<5.0",
  "lxml>=6.1,<7.0",
  "pypdf>=6.15,<7.0",
  "watchdog>=4.0,<7.0",
]

[dependency-groups]
dev = [
  "pg8000>=1.31,<2.0",
  "pytest>=9.0.3,<10.0",
  "pytest-asyncio>=1.4,<2.0",
]
sidecar = [
  "pyinstaller==6.21.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["refora_server"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
